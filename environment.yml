# Conda environment for full reproducibility, including the GMT C library and
# GDAL that the map scripts (figures/maps/*.sh) and PyGMT depend on.
#
#   conda env create -f environment.yml
#   conda activate precision-ag
#
name: precision-ag
channels:
  - conda-forge
dependencies:
  - python=3.11
  - gmt>=6.4          # GMT C library, used by the .sh map scripts and PyGMT
  - pygmt>=0.10
  - gdal>=3.6         # provides gdalwarp / gdal_translate / ogr2ogr
  - geopandas>=0.14
  - rasterio>=1.3
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - xgboost>=2.0
  - pykrige>=1.7
  - pip
  - pip:
      - shap>=0.44
